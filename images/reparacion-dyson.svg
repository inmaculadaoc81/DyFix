<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aspiradora, secador de pelo y purificador de aire sobre la mesa de trabajo del servicio técnico DysonTech">
  <defs>
    <linearGradient id="dtBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232A3D"/>
      <stop offset="1" stop-color="#12151F"/>
    </linearGradient>
    <linearGradient id="dtBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AC8FF"/>
      <stop offset="1" stop-color="#2E7AD1"/>
    </linearGradient>
    <filter id="dtSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#12151F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- backdrop rings echoing the DyFix ring icon -->
  <circle cx="990" cy="190" r="150" fill="none" stroke="#DCE6F2" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="990" cy="190" r="98" fill="none" stroke="#DCE6F2" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="130" cy="600" r="110" fill="none" stroke="#DCE6F2" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- desk -->
  <rect x="90" y="588" width="1020" height="24" rx="12" fill="#E4EAF3"/>
  <rect x="140" y="612" width="16" height="110" fill="#D6DEEA"/>
  <rect x="1040" y="612" width="16" height="110" fill="#D6DEEA"/>

  <!-- air purifier tower -->
  <g filter="url(#dtSoft)">
    <rect x="840" y="330" width="150" height="258" rx="26" fill="url(#dtBodyGrad)"/>
    <rect x="864" y="360" width="102" height="8" rx="4" fill="#3A4560"/>
    <rect x="864" y="380" width="102" height="8" rx="4" fill="#3A4560"/>
    <rect x="864" y="400" width="102" height="8" rx="4" fill="#3A4560"/>
    <rect x="864" y="420" width="102" height="8" rx="4" fill="#3A4560"/>
    <circle cx="915" cy="500" r="42" fill="none" stroke="#8AC8FF" stroke-width="4" stroke-opacity=".8"/>
    <circle cx="915" cy="500" r="20" fill="none" stroke="#8AC8FF" stroke-width="4" stroke-opacity=".5"/>
    <circle cx="944" cy="472" r="7" fill="#4FA3F0"/>
  </g>

  <!-- cordless stick vacuum (hero item, cyclone rings) -->
  <g filter="url(#dtSoft)">
    <rect x="520" y="470" width="20" height="118" rx="8" fill="url(#dtBodyGrad)"/>
    <rect x="470" y="565" width="120" height="24" rx="10" fill="url(#dtBodyGrad)"/>
    <rect x="498" y="240" width="46" height="240" rx="20" fill="url(#dtBodyGrad)"/>
    <rect x="510" y="270" width="22" height="90" rx="8" fill="#3A4560"/>
    <circle cx="521" cy="200" r="62" fill="url(#dtBodyGrad)"/>
    <circle cx="521" cy="200" r="46" fill="none" stroke="#4FA3F0" stroke-width="6"/>
    <circle cx="521" cy="200" r="28" fill="none" stroke="#8AC8FF" stroke-width="5"/>
    <circle cx="521" cy="200" r="10" fill="#12151F"/>
    <rect x="470" y="150" width="18" height="70" rx="8" fill="url(#dtBlueGrad)" transform="rotate(-18 470 150)"/>
  </g>

  <!-- floating orbit nodes / connection lines -->
  <g stroke="#B7C6DA" stroke-width="2" stroke-dasharray="3 6" fill="none">
    <path d="M770 220 Q 890 180 950 240"/>
    <path d="M340 320 Q 240 260 210 200"/>
  </g>
  <circle cx="950" cy="240" r="12" fill="#2E7AD1"/>
  <circle cx="210" cy="200" r="10" fill="#4FA3F0"/>
  <circle cx="1020" cy="310" r="8" fill="#8AC8FF"/>
  <circle cx="140" cy="270" r="7" fill="#2E7AD1"/>

  <!-- hair styler / airwrap-style tool -->
  <g filter="url(#dtSoft)" transform="translate(230,430) rotate(-14)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="url(#dtBodyGrad)"/>
    <rect x="150" y="6" width="46" height="22" rx="11" fill="url(#dtBlueGrad)"/>
    <rect x="-58" y="6" width="60" height="22" rx="11" fill="#3A4560"/>
  </g>

  <!-- table lamp -->
  <g filter="url(#dtSoft)" transform="translate(1000,470)">
    <rect x="-6" y="70" width="60" height="14" rx="7" fill="#3A4560"/>
    <rect x="18" y="10" width="10" height="64" rx="5" fill="#3A4560"/>
    <path d="M23 10 C -20 -10, -34 40, 4 56" fill="none" stroke="#3A4560" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="6" cy="52" rx="26" ry="16" fill="url(#dtBlueGrad)"/>
  </g>

  <!-- toolbox -->
  <g filter="url(#dtSoft)">
    <rect x="120" y="480" width="150" height="86" rx="14" fill="#FFFFFF" stroke="#E2E7F1" stroke-width="2"/>
    <rect x="120" y="480" width="150" height="30" rx="14" fill="url(#dtBlueGrad)"/>
    <rect x="180" y="470" width="30" height="20" rx="4" fill="#2E7AD1"/>
  </g>
</svg>
